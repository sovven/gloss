<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="ui.css" />
  <style>
    body { width: 340px; padding: 14px 14px 12px; }
    .group { margin-bottom: 8px; }
    .row { min-height: 40px; padding-top: 5px; padding-bottom: 5px; }
    .row.col { padding-top: 9px; padding-bottom: 10px; gap: 8px; }
    .quick { padding: 10px; margin-bottom: 8px; }
    .quick textarea { margin: 0; }

    /* 顶栏 */
    .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .brand { display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
    .brand img { width: 24px; height: 24px; border-radius: 7px; }
    .status { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px; border-radius: 999px; font-size: 11.5px; font-weight: 550; color: var(--muted); background: var(--fill); }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: 0.6; }
    .status.on { color: var(--accent-text); background: var(--accent-soft); }
    .status.on::before { opacity: 1; box-shadow: 0 0 0 3px var(--accent-ring); }

    /* 主按钮 */
    .hero { width: 100%; height: 46px; border-radius: var(--r-lg); font-size: 15px; }
    .hero .label { flex: 1; text-align: left; padding-left: 4px; }
    .hint { margin: 7px 2px 12px; font-size: 12px; color: var(--muted); }
    .hint kbd { font-size: 10.5px; }
    .hint .link { margin-left: 6px; }
    #keys { display: inline-flex; gap: 3px; }

    /* 提示条 */
    .notice { display: flex; gap: 10px; align-items: center; padding: 10px 12px; margin-bottom: 12px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--warn-text); font-size: 12px; line-height: 1.45; }
    .notice button { margin-left: auto; flex-shrink: 0; }

    /* 译文样式预览 */
    .swatches { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .swatch { appearance: none; border: 1px solid var(--border); background: var(--bg); border-radius: var(--r-sm); padding: 8px 7px 6px; cursor: pointer; display: flex; flex-direction: column; gap: 5px; align-items: stretch; color: var(--muted); font: 500 10.5px/1 var(--font); transition: border-color .15s, box-shadow .15s, color .15s; }
    .swatch:hover { border-color: var(--border-strong); color: var(--text); }
    .swatch.active { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring); color: var(--text); }
    .swatch i { display: block; height: 4px; border-radius: 2px; background: var(--line-strong); }
    .swatch i.t { width: 78%; background: var(--text); opacity: .75; }
    .swatch[data-v=line] i.t { margin-left: 5px; box-shadow: -5px 0 0 -1px var(--accent); }
    .swatch[data-v=underline] i.t { box-shadow: 0 3px 0 -1px var(--accent); }
    .swatch[data-v=highlight] i.t { box-shadow: 0 0 0 2px var(--accent-soft-strong); }
    .swatch[data-v=dim] i.t { opacity: .28; }
    .swatch span { margin-top: 3px; text-align: center; }

    textarea { width: 100%; height: 56px; resize: vertical; }
    #result { margin-top: 8px; padding: 10px 12px; border-radius: var(--r-md); background: var(--fill); white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.55; }
    #result:empty { display: none; }

    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding: 0 2px; font-size: 11.5px; color: var(--muted); }
    .foot nav { display: flex; gap: 12px; }
    .foot a { color: var(--muted); text-decoration: none; }
    .foot a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="icons/icon48.png" alt="" />Gloss</div>
    <span class="status" id="status">未翻译</span>
  </div>

  <button class="btn primary hero" id="page"><span class="label">翻译此网页</span><span id="keys"></span></button>
  <div class="hint">鼠标停在段落上，单独按一下 <kbd>Ctrl</kbd> 可以只翻译这一段<a href="#" class="link" id="setKeys" hidden>设置快捷键</a></div>

  <div class="notice" id="fallback" hidden>
    <span>Google 翻译连不上，已自动改用微软翻译。</span>
    <button class="btn small" id="useMs">一直用微软</button>
  </div>

  <div class="group">
    <div class="card">
      <div class="row">
        <span>翻译服务</span>
        <div class="seg" data-key="engine">
          <button data-v="google">Google</button><button data-v="microsoft">微软</button><button data-v="ai">AI</button>
        </div>
      </div>
      <div class="row sub" id="aiRow" hidden>
        <span id="aiInfo" class="muted"></span>
        <a href="#" class="link" data-options>AI 设置 ›</a>
      </div>
      <div class="row">
        <span>翻译成</span>
        <select id="targetLang" class="select">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
        </select>
      </div>
    </div>
  </div>

  <div class="group">
    <div class="card">
      <div class="row">
        <span>模式</span>
        <div class="seg" data-key="mode"><button data-v="dual">双语对照</button><button data-v="only">仅译文</button></div>
      </div>
      <div class="row col">
        <span>译文样式</span>
        <div class="swatches" data-key="style">
          <button class="swatch" data-v="line" title="左侧竖线"><i></i><i class="t"></i><span>竖线</span></button>
          <button class="swatch" data-v="underline" title="虚线下划线"><i></i><i class="t"></i><span>下划线</span></button>
          <button class="swatch" data-v="highlight" title="背景高亮"><i></i><i class="t"></i><span>高亮</span></button>
          <button class="swatch" data-v="dim" title="淡色"><i></i><i class="t"></i><span>淡色</span></button>
          <button class="swatch" data-v="plain" title="无样式"><i></i><i class="t"></i><span>无</span></button>
        </div>
      </div>
    </div>
  </div>

  <div class="group">
    <div class="card">
      <label class="row"><span id="alwaysTxt">总是翻译此网站</span><input type="checkbox" class="switch" id="always" /></label>
      <label class="row"><span>自动翻译所有外语网页</span><input type="checkbox" class="switch" id="autoForeign" /></label>
      <div class="row">
        <span>划词翻译</span>
        <div class="seg" data-key="selectMode"><button data-v="button">按钮</button><button data-v="auto">直接</button><button data-v="off">关闭</button></div>
      </div>
    </div>
  </div>

  <div class="card quick" id="quick" hidden>
    <textarea id="input" class="input" placeholder="输入或粘贴文字，Ctrl + Enter 翻译"></textarea>
    <div id="result"></div>
  </div>

  <div class="foot">
    <span id="version"></span>
    <nav><a href="#" id="quickToggle">输入翻译</a><a href="#" data-options>AI 设置</a><a href="https://github.com/sovven/gloss" target="_blank">GitHub</a></nav>
  </div>

  <script src="popup.js"></script>
</body>
</html>
