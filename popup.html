<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --c: #059669; --bg: #fff; --fg: #222; --sub: #888; --line: #e6e6e6; --soft: #f0fdf4; }
    @media (prefers-color-scheme: dark) { :root { --bg: #232427; --fg: #eee; --sub: #999; --line: #3a3b3f; --soft: #2d2e32; } }
    body { width: 320px; margin: 0; padding: 14px; font: 13px "Segoe UI", "Microsoft YaHei", sans-serif; color: var(--fg); background: var(--bg); }
    h1 { font-size: 16px; margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 8px; }
    h1 small { font-size: 12px; color: var(--sub); font-weight: normal; }
    .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; margin: 10px 0; }
    select { padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: var(--bg); color: var(--fg); min-width: 130px; }
    button { padding: 6px 14px; border: 0; border-radius: 6px; background: var(--c); color: #fff; cursor: pointer; font: inherit; }
    button:hover { filter: brightness(0.93); }
    button:disabled { background: #aaa; cursor: default; }
    #page { width: 100%; padding: 10px; font-size: 15px; }
    #page.on { background: #888; }
    .hint { font-size: 12px; color: var(--sub); margin: 6px 0 4px; line-height: 1.5; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
    label.opt { display: flex; gap: 6px; align-items: center; margin: 8px 0; cursor: pointer; word-break: break-all; }
    details summary { cursor: pointer; color: var(--sub); }
    textarea { width: 100%; box-sizing: border-box; height: 70px; margin-top: 8px; padding: 8px; border: 1px solid var(--line); border-radius: 8px; resize: vertical; font: inherit; background: var(--bg); color: var(--fg); }
    #result { margin-top: 8px; padding: 8px; background: var(--soft); border-radius: 8px; white-space: pre-wrap; word-break: break-word; }
    #result:empty { display: none; }
    a { color: var(--c); }
    #aiHint { margin: -4px 0 6px; text-align: right; }
    #aiInfo.warn { color: #d33; }
  </style>
</head>
<body>
  <h1><span class="brand"><img src="icons/icon32.png" alt="" width="22" height="22" />沉浸式双语翻译</span> <small>Alt+A</small></h1>

  <button id="page">翻译此网页</button>
  <div class="hint">鼠标悬停在段落上，单独按一下 Ctrl 可以只翻译这一段</div>

  <div class="row"><span>翻译服务</span>
    <select id="engine">
      <option value="google">Google 翻译</option>
      <option value="microsoft">微软翻译</option>
      <option value="ai">AI 翻译</option>
    </select>
  </div>
  <div class="hint" id="aiHint" hidden><span id="aiInfo"></span> · <a href="#" id="openOptions">AI 设置</a></div>

  <div class="row"><span>目标语言</span>
    <select id="targetLang">
      <option value="zh-CN">简体中文</option>
      <option value="zh-TW">繁體中文</option>
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="ko">한국어</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="es">Español</option>
      <option value="ru">Русский</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ไทย</option>
    </select>
  </div>
  <div class="row"><span>显示模式</span>
    <select id="mode">
      <option value="dual">双语对照</option>
      <option value="only">仅译文</option>
    </select>
  </div>
  <div class="row"><span>译文样式</span>
    <select id="style">
      <option value="line">左侧竖线</option>
      <option value="underline">虚线下划线</option>
      <option value="highlight">背景高亮</option>
      <option value="dim">淡色</option>
      <option value="plain">无样式</option>
    </select>
  </div>
  <div class="row"><span>划词翻译</span>
    <select id="selectMode">
      <option value="button">显示「译」按钮</option>
      <option value="auto">直接弹出翻译</option>
      <option value="off">关闭</option>
    </select>
  </div>

  <hr />
  <label class="opt"><input type="checkbox" id="always" /> <span id="alwaysTxt">总是翻译此网站</span></label>
  <label class="opt"><input type="checkbox" id="autoForeign" /> 自动翻译所有外语网页</label>

  <hr />
  <details>
    <summary>输入文字翻译</summary>
    <textarea id="input" placeholder="输入文字，Ctrl+Enter 翻译"></textarea>
    <div class="row" style="justify-content:flex-end;margin:6px 0 0"><button id="go">翻译</button></div>
    <div id="result"></div>
  </details>

  <script src="popup.js"></script>
</body>
</html>
